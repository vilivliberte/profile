<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>店舗一覧 | Liberte FC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="contact.css" /> <!-- Reuse base layout styles -->
  <style>
    /* Specific styles for shop grid */
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }
    .shop-card {
      background: var(--white);
      border-radius: var(--radius-sm);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      border: 1.5px solid rgba(30,58,138,0.08);
      position: relative;
      overflow: hidden;
    }
    .shop-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--navy-dark), var(--navy));
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .shop-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--navy-light);
    }
    .shop-card:hover::after {
      opacity: 1;
    }
    .shop-area-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--navy-dark);
      margin-bottom: 12px;
      text-align: center;
    }
    .shop-count-wrap {
      background: var(--sky-light);
      padding: 10px 24px;
      border-radius: 40px;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .shop-count {
      font-size: 2rem;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
    }
    .shop-count-label {
      font-size: 0.85rem;
      color: var(--text-mid);
      font-weight: 600;
    }
    /* 出店予定のデザイン */
    .upcoming-box {
      margin-top: 16px;
      background: #f0fdf4; /* 薄い緑色でポジティブな印象に */
      border: 1px solid #bbf7d0;
      border-radius: 6px;
      padding: 10px 12px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .shop-card:hover .upcoming-box {
      background: #dcfce7;
      border-color: #86efac;
    }
    .upcoming-label {
      font-size: 0.65rem;
      color: #166534;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .upcoming-text {
      font-size: 0.85rem;
      font-weight: 700;
      color: #15803d;
    }
    .loading-spinner {
      text-align: center;
      padding: 60px 20px;
      color: var(--navy);
    }
  </style>
</head>
<body>

  <header class="contact-header">
    <a href="index.html" class="back-btn">
      <i class="fa-solid fa-chevron-left"></i> TOP
    </a>
    <img src="images/logo.png" alt="Liberte ロゴ" class="header-logo" />
  </header>

  <main class="contact-container">
    <h1 class="page-title">全国の店舗エリア</h1>
    <p class="page-desc">
      全国へ展開中のLiberte加盟店エリア一覧です。<br>
      各エリアをクリックすると、公式サイトの店舗詳細へ遷移します。
    </p>

    <!-- Loading State -->
    <div id="loading" class="loading-spinner">
      <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
      <p style="margin-top: 16px; font-size: 0.9rem; font-weight: 600;">最新の店舗情報を読み込んでいます...</p>
    </div>

    <!-- Shop Grid -->
    <div id="shop-container" class="shop-grid" style="display: none;">
      <!-- JS will dynamically inject shop cards here -->
    </div>
  </main>

  <footer class="contact-footer">
    <p class="footer-text">© 2024 Liberte Franchise. All rights reserved.</p>
  </footer>

  <script>
    // 公式サイトの店舗数は手動設定（Cloudflareブロック対策）
    const shopData = [
      { name: '北海道・東北エリア', count: '1', link: 'https://liberte-salon.net/shop/area/hokkaido-tohoku/' },
      { name: '関東エリア', count: '0', link: '#' },
      { name: '中部エリア', count: '8', link: 'https://liberte-salon.net/shop/area/chubu/' },
      { name: '近畿エリア', count: '0', link: '#' },
      { name: '中国・四国エリア', count: '3', link: 'https://liberte-salon.net/shop/area/chugoku-shikoku/' },
      { name: '九州・沖縄エリア', count: '0', link: '#' }
    ];

    // スプレッドシートのCSV公開URL
    const SPREADSHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTpEBk3B-adUqt5KpcX83PsMozK-UwFx5e2BqjcAhc3w-Bi_xZUUqlkE1B347K-JFzC23IhuFAuQloJ/pub?output=csv';

    // CSVをパースして { '関東エリア': '東京・神奈川', ... } の辞書を作る関数
    async function fetchUpcomingData() {
      try {
        const res = await fetch(SPREADSHEET_CSV_URL);
        if (!res.ok) return {};
        const csvText = await res.text();
        
        // 簡単なCSVパース処理（改行で分割、カンマで分割）
        const rows = csvText.split('\\n');
        const upcomingMap = {};
        
        rows.forEach(row => {
          const cols = row.split(',').map(col => col.replace(/^"|"$/g, '').trim());
          // A列にエリア名、B列に出店予定地域が入っている想定
          if (cols.length >= 2) {
            const areaName = cols[0];
            const upcomingLocations = cols[1];
            // ヘッダー行や空行を除外
            if (areaName && upcomingLocations && !areaName.includes('エリア名')) {
              upcomingMap[areaName] = upcomingLocations;
            }
          }
        });
        return upcomingMap;
      } catch (error) {
        console.error('スプレッドシートの取得に失敗しました:', error);
        return {};
      }
    }

    async function loadShops() {
      const container = document.getElementById('shop-container');
      const loading = document.getElementById('loading');

      // スプレッドシートから出店予定データを取得
      const upcomingMap = await fetchUpcomingData();

      // カードを生成
      shopData.forEach(item => {
        const card = document.createElement('a');
        card.className = 'shop-card';
        card.href = item.link;
        if (item.link !== '#') {
          card.target = '_blank';
          card.rel = 'noopener noreferrer';
        }
        
        // このエリアに出店予定があるかチェック（部分一致でもOKにする）
        let upcomingHtml = '';
        for (const [sheetArea, locations] of Object.entries(upcomingMap)) {
          if (item.name.includes(sheetArea) || sheetArea.includes(item.name)) {
            if (locations !== '') {
              upcomingHtml = `
                <div class="upcoming-box">
                  <span class="upcoming-label">出店予定エリア</span>
                  <span class="upcoming-text">${locations}</span>
                </div>
              `;
            }
            break;
          }
        }

        card.innerHTML = `
          <div class="shop-area-name">${item.name}</div>
          <div class="shop-count-wrap">
            <span class="shop-count">${item.count}</span>
            <span class="shop-count-label">店舗</span>
          </div>
          ${upcomingHtml}
        `;
        
        container.appendChild(card);
      });

      // ローディングを非表示にし、一覧を表示
      loading.style.display = 'none';
      container.style.display = 'grid';
    }

    // ページ読み込み時に実行
    document.addEventListener('DOMContentLoaded', loadShops);
  </script>
</body>
</html>
